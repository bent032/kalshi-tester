name: Phase 1 - read-only odds check

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Which Kalshi host to READ prices from (no orders are ever placed)"
        type: choice
        options: [prod, demo]
        default: prod
      markets:
        description: "Number of full 15-minute markets to observe"
        default: "3"

jobs:
  odds-check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run read-only odds check
        shell: bash
        run: |
          mkdir -p logs
          python -u -m kalshi_bot.odds_check \
            --env "${{ inputs.env }}" \
            --markets "${{ inputs.markets }}" \
            --max-minutes 70 | tee logs/odds_check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-odds-check
          path: logs/odds_check.*
